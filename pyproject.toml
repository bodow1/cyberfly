[project]
name = "cyberfly"
version = "0.1.0"
description = "A 32-bit RISC-V computer compiled into the brain of a fruit fly"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bodo Wirth" }, { name = "Naveen Kannan" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=18,<21",
    "yowasp-yosys>=0.40",
    "pillow>=10",
]

[project.optional-dependencies]
body = ["flygym==1.2.0"]
gpu = ["cupy-cuda12x>=13"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cyberfly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
